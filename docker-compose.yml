version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: university_attendance_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-university_attendance}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d university_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: university_attendance_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/university_attendance?schema=public
      PUBLIC_ATTENDANCE_URL: ${PUBLIC_ATTENDANCE_URL:-http://localhost:5173/scan}
      SESSION_SECRET: ${SESSION_SECRET:-super-secret-production-key-change-me-1234567890}
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      AUTO_APPROVE_STUDENTS: ${AUTO_APPROVE_STUDENTS:-true}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: university_attendance_frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_PUBLIC_ATTENDANCE_URL: http://localhost:5173/scan
    ports:
      - "5173:80"

volumes:
  postgres_data:
