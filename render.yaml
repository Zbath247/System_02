services:
  # 1. Backend Web Service
  - type: web
    name: university-attendance-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: university-attendance-frontend
          property: host
      - key: PUBLIC_ATTENDANCE_URL
        sync: false
      - key: AUTO_APPROVE_STUDENTS
        value: "true"

  # 2. Frontend Static Site
  - type: web
    name: university-attendance-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://university-attendance-backend-8wb3.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://university-attendance-backend-8wb3.onrender.com
